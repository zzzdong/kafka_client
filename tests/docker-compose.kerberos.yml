services:
  kdc:
    build:
      context: ./fixtures/kerberos
      dockerfile: Dockerfile.kdc
    hostname: kdc.example.com
    container_name: kdc-kerberos
    ports:
      - "8888:88"
    volumes:
      - ./fixtures/kerberos/keytabs:/etc/keytabs
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/localhost/88' 2>/dev/null"]
      interval: 3s
      retries: 20
      start_period: 15s

  kafka:
    image: apache/kafka:4.3.0
    hostname: broker.example.com
    container_name: kafka-kerberos-broker
    depends_on:
      kdc:
        condition: service_healthy
    ports:
      - "9096:9096"
    volumes:
      - ./fixtures/kerberos/keytabs:/etc/kafka/secrets:ro
      - ./fixtures/kerberos/krb5.conf:/etc/krb5.conf:ro
      - ./fixtures/kerberos/kafka_jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro
    environment:
      KAFKA_OPTS: >-
        -Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf
        -Djava.security.krb5.conf=/etc/krb5.conf
        -Dsun.security.krb5.debug=true
        -Djavax.security.auth.useSubjectCredsOnly=true
        -Dsun.security.jgss.debug=true
        -Djavax.security.auth.useSubjectCredsOnly=true
        -Djava.security.debug=all
      # KAFKA_LOG4J_LOGGERS: >-
      #   kafka.network.RequestChannel=DEBUG,
      #   kafka.network.Processor=TRACE,
      #   org.apache.kafka.common.security=DEBUG
      # KRaft 单节点
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker.example.com:9093'
      CLUSTER_ID: 'kafka-docker-kerberos'
      # 监听器
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:9096,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://localhost:9096,CONTROLLER://broker.example.com:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # GSSAPI 配置
      KAFKA_SASL_ENABLED_MECHANISMS: GSSAPI
      KAFKA_LISTENER_NAME_SASL_PLAINTEXT_SASL_ENABLED_MECHANISMS: GSSAPI
      KAFKA_SASL_KERBEROS_SERVICE_NAME: kafka
      KAFKA_SASL_KERBEROS_PRINCIPAL_TO_LOCAL_RULES: DEFAULT
      # 主题配置
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

