
# 多 broker 集群专用 krb5.conf。
# 使用独立的 realm MULTI.EXAMPLE.COM 和独立的 KDC 别名 kdc-multi.example.com,
# 以便与单节点 Kerberos stack (EXAMPLE.COM / kdc.example.com) 并行运行。
[libdefaults]
  default_realm = MULTI.EXAMPLE.COM
  dns_lookup_kdc = false
  dns_lookup_realm = false
  ticket_lifetime = 24h
  renew_lifetime = 7d
  forwardable = true

[realms]
  MULTI.EXAMPLE.COM = {
    kdc = kdc-multi.example.com:88
    admin_server = kdc-multi.example.com:749
    default_domain = example.com
  }

[domain_realm]
  .example.com = MULTI.EXAMPLE.COM
  example.com = MULTI.EXAMPLE.COM
  localhost = MULTI.EXAMPLE.COM
  .localhost = MULTI.EXAMPLE.COM
